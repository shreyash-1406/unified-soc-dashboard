<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Unified SOC Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('dashboard') }}"><span class="pulse"></span>Unified SOC</a>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('alerts_view') }}" class="{{ 'on' if request.endpoint == 'alerts_view' }}">Alerts</a>
      <a href="{{ url_for('ingest_form') }}" class="{{ 'on' if request.endpoint == 'ingest_form' }}">Ingest</a>
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
